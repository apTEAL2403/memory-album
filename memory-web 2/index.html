<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモリーアルバム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(ellipse at 50% -10%, #3a2623 0%, #1a0b08 60%);
    color: #eee;
    font-family: "Zen Kaku Gothic New", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: clamp(28px, 5vw, 46px);
    letter-spacing: 0.08em;
    margin: 0 0 6px;
  }
  p.lead { color: #a3a3ad; font-size: 14px; margin: 0 0 46px; letter-spacing: 0.04em; }
  .doors {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
    max-width: 900px;
    width: 100%;
  }
  .door {
    position: relative;
    border-radius: 14px;
    padding: 34px 22px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    border: 2px solid #ffffff81;
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.25s ease;
  }
  .door:hover { transform: translateY(-6px); }
  .door .door-title {
    font-family: "Cormorant Garamond", serif;
    font-size: 24px;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .door .door-sub { font-size: 12px; color: rgba(46, 46, 46, 0.6); }

  .door.family {
    background: linear-gradient(160deg, #b4eaff, #0a5877);
  }
  .door.family:hover { border-color: rgba(0, 186, 177, 0.6); }

  .door.friend {
    background: linear-gradient(160deg, #b4eaff, #0a5877);
  }
  .door.friend:hover { border-color: rgba(212, 144, 255, 0.6); }

  .door.boyfriend {
    background: linear-gradient(160deg, #b4eaff, #0a5877);
  }
  .door.boyfriend:hover { border-color: #ec6e68; }

  footer { margin-top: 50px; font-size: 11px; color: #666; }
</style>
</head>
<body>

  <h1>葵との思い出ギャラリー</h1>
  <p class="lead">一緒に作った数々の思い出、もっと増やしていこ🥰💐</p>

  <div class="doors">
    <a class="door family" href="family/index.html">
      <div class="door-title">家族TEAL</div>
      <div class="door-sub">FAMILY</div>
    </a>
    <a class="door friend" href="friend/index.html">
      <div class="door-title">りな</div>
      <div class="door-sub">Rina</div>
    </a>
    <a class="door boyfriend" href="boyfriend/index.html">
      <div class="door-title">将人</div>
      <div class="door-sub">Masato</div>
    </a>
  </div>

  <footer>各ページには合言葉が必要です</footer>

</body>
</html>
