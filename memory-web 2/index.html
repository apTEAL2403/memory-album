<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモリーアルバム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf3e8;
    --cream-alt: #f2e8d8;
    --brown: #c9a97a;
    --brown-deep: #a8895f;
    --coral: #f0876f;
    --coral-deep: #e0715a;
    --green: #4d7563;
    --green-deep: #35564a;
    --text: #4a3f33;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-alt) 100%);
    color: var(--text);
    font-family: "Zen Maru Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 60px 20px 140px;
    position: relative;
    overflow-x: hidden;
  }

  h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: clamp(26px, 5vw, 42px);
    letter-spacing: 0.06em;
    margin: 0 0 8px;
    color: var(--green-deep);
    position: relative; z-index: 2;
  }
  p.lead { color: var(--brown-deep); font-size: 14px; margin: 0 0 50px; letter-spacing: 0.02em; position: relative; z-index: 2; }

  .doors {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 26px;
    max-width: 820px;
    width: 100%;
    position: relative; z-index: 2;
  }
  .door {
    position: relative;
    border-radius: 20px;
    padding: 30px 20px;
    text-align: center;
    text-decoration: none;
    overflow: visible;
    box-shadow: 0 10px 26px rgba(80, 60, 40, 0.12);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .door:hover { transform: translateY(-5px); box-shadow: 0 16px 30px rgba(80, 60, 40, 0.16); }
  .door .door-title {
    font-family: "Cormorant Garamond", serif;
    font-size: 22px;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .door .door-sub { font-size: 11px; letter-spacing: 0.06em; opacity: 0.75; }

  .door.family { background: var(--coral); color: #fff8f3; }
  .door.friend { background: var(--green); color: #f6fbf8; }
  .door.boyfriend { background: var(--brown); color: #3b2f22; }

  footer { margin-top: 46px; font-size: 11px; color: var(--brown-deep); opacity: 0.8; position: relative; z-index: 2; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; }
  }

  /* ------------------------------------------------------------
     足跡（背景に控えめに散らす）
     ------------------------------------------------------------ */
  .paw {
    position: absolute; width: 20px; height: 20px; opacity: 0.22; z-index: 1;
    background: no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><ellipse cx='20' cy='26' rx='11' ry='9' fill='%23a8895f'/><ellipse cx='9' cy='12' rx='5' ry='6.5' fill='%23a8895f'/><ellipse cx='19' cy='6' rx='5' ry='6.5' fill='%23a8895f'/><ellipse cx='29' cy='9' rx='5' ry='6.5' fill='%23a8895f'/><ellipse cx='34' cy='18' rx='4.5' ry='6' fill='%23a8895f'/></svg>");
  }

  /* ------------------------------------------------------------
     猫の共通パーツ（シルエット・ミニマル）
     ------------------------------------------------------------ */
  .cat-svg { display: block; }

  /* 優雅に歩く猫 */
  #walking-cat {
    position: fixed; left: -80px; bottom: 14px; width: 70px; height: 42px; z-index: 1;
    animation: walk-across 26s linear infinite;
  }
  #walking-cat .legs { animation: walk-bob 0.5s ease-in-out infinite; }
  @keyframes walk-across {
    0% { left: -80px; }
    100% { left: 110%; }
  }
  @keyframes walk-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1.5px); }
  }

  /* ボタンの上で寝ている猫 */
  .sleeping-cat {
    position: absolute; top: -22px; right: 8px; width: 56px; height: 34px; z-index: 3;
    animation: breathe 3.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  /* ボタンの陰から覗く猫 */
  .peeking-cat {
    position: absolute; bottom: -6px; left: -14px; width: 34px; height: 30px; z-index: 3;
    animation: peek 5s ease-in-out infinite;
  }
  @keyframes peek {
    0%, 40%, 100% { transform: translateX(0); }
    20% { transform: translateX(6px); }
  }

  /* ゴロゴロ転がる猫 */
  #rolling-cat {
    position: fixed; left: 6%; bottom: 12px; width: 60px; height: 36px; z-index: 1;
    animation: purr 2.6s ease-in-out infinite;
  }
  @keyframes purr {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(-4deg) scale(1.02); }
  }

  /* 光を追いかけてはしゃぐ猫 */
  #chasing-cat-wrap { position: fixed; right: 6%; top: 18%; width: 90px; height: 90px; z-index: 1; }
  #chasing-light {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle, #fff8e0, var(--coral) 70%);
    box-shadow: 0 0 10px 3px rgba(240,135,111,0.5);
    animation: light-spin 4s linear infinite;
  }
  @keyframes light-spin {
    0% { transform: translate(30px, 10px) rotate(0deg) translateX(20px) rotate(0deg); }
    100% { transform: translate(30px, 10px) rotate(360deg) translateX(20px) rotate(-360deg); }
  }
  #chasing-cat { position: absolute; bottom: 0; left: 6px; width: 52px; height: 40px; animation: pounce 1.1s ease-in-out infinite; }
  @keyframes pounce {
    0%, 100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-6px) scale(1.03); }
    55% { transform: translateY(0) scale(0.98); }
  }

  /* じゃれ合う2匹 */
  #playing-cats { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); width: 120px; height: 44px; z-index: 1; }
  #playing-cats .paw-swipe { animation: swipe 1.4s ease-in-out infinite; transform-origin: 70% 60%; }
  @keyframes swipe {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-18deg); }
  }
</style>
</head>
<body>

  <!-- 足跡（控えめに点在） -->
  <div class="paw" style="top:12%; left:8%; transform:rotate(-15deg);"></div>
  <div class="paw" style="top:22%; left:14%; transform:rotate(5deg);"></div>
  <div class="paw" style="top:70%; left:20%; transform:rotate(30deg);"></div>
  <div class="paw" style="top:78%; left:26%; transform:rotate(50deg);"></div>
  <div class="paw" style="top:15%; right:10%; transform:rotate(160deg);"></div>
  <div class="paw" style="top:60%; right:16%; transform:rotate(-40deg);"></div>
  <div class="paw" style="top:40%; left:4%; transform:rotate(-70deg);"></div>
  <div class="paw" style="top:85%; right:8%; transform:rotate(100deg);"></div>

  <h1>葵との思い出ギャラリー</h1>
  <p class="lead">一緒に作った数々の思い出、もっと増やしていこ🥰💐</p>

  <div class="doors">
    <a class="door family" href="family/index.html">
      <div class="door-title">家族TEAL</div>
      <div class="door-sub">FAMILY</div>
      <!-- ボタンの上で寝ている猫 -->
      <svg class="cat-svg sleeping-cat" viewBox="0 0 56 34" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="26" cy="22" rx="24" ry="11" fill="#f2e8d8"/>
        <path d="M46,20 C54,16 54,8 48,7 C51,12 47,17 42,18 Z" fill="#f2e8d8"/>
        <path d="M8,16 L11,8 L16,15 Z" fill="#f2e8d8"/>
        <path d="M17,14 L21,6 L24,14 Z" fill="#f2e8d8"/>
        <path d="M14,20 C11,22 12,25 15,24" stroke="#c9a97a" stroke-width="1.2" fill="none"/>
      </svg>
    </a>
    <a class="door friend" href="friend/index.html">
      <div class="door-title">りな</div>
      <div class="door-sub">Rina</div>
      <!-- ボタンの陰から覗く猫 -->
      <svg class="cat-svg peeking-cat" viewBox="0 0 34 30" xmlns="http://www.w3.org/2000/svg">
        <path d="M4,30 C4,14 10,6 17,6 C24,6 30,14 30,30 Z" fill="#c9a97a"/>
        <path d="M6,10 L9,2 L13,9 Z" fill="#c9a97a"/>
        <path d="M21,9 L25,2 L28,10 Z" fill="#c9a97a"/>
        <circle cx="12" cy="15" r="1.6" fill="#fff8f3"/>
        <circle cx="22" cy="15" r="1.6" fill="#fff8f3"/>
      </svg>
    </a>
    <a class="door boyfriend" href="boyfriend/index.html">
      <div class="door-title">将人</div>
      <div class="door-sub">Masato</div>
    </a>
  </div>

  <footer>各ページには合言葉が必要です</footer>

  <!-- 優雅に歩く猫 -->
  <svg id="walking-cat" class="cat-svg" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="52" cy="38" rx="28" ry="14" fill="#f0876f"/>
    <circle cx="22" cy="24" r="13" fill="#f0876f"/>
    <path d="M12,16 L16,6 L22,15 Z" fill="#f0876f"/>
    <path d="M26,15 L32,5 L34,17 Z" fill="#f0876f"/>
    <path d="M72,30 C86,26 90,10 80,6 C85,16 78,25 68,27 Z" fill="#f0876f"/>
    <circle cx="18" cy="22" r="1.5" fill="#fff8f3"/>
    <g class="legs">
      <ellipse cx="34" cy="50" rx="4" ry="9" fill="#f0876f"/>
      <ellipse cx="50" cy="51" rx="4" ry="9" fill="#f0876f"/>
      <ellipse cx="66" cy="50" rx="4" ry="9" fill="#f0876f"/>
      <ellipse cx="78" cy="49" rx="4" ry="9" fill="#f0876f"/>
    </g>
  </svg>

  <!-- ゴロゴロ転がる猫 -->
  <svg id="rolling-cat" class="cat-svg" viewBox="0 0 60 36" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="30" cy="20" rx="26" ry="14" fill="#4d7563"/>
    <path d="M50,18 C58,14 58,4 50,4 C54,10 50,16 44,17 Z" fill="#4d7563"/>
    <circle cx="12" cy="14" r="9" fill="#4d7563"/>
    <path d="M6,9 L8,3 L12,8 Z" fill="#4d7563"/>
    <path d="M14,8 L18,2 L19,9 Z" fill="#4d7563"/>
    <circle cx="9" cy="13" r="1.2" fill="#f6fbf8"/>
    <path d="M6,20 C10,26 20,28 26,24" stroke="#f6fbf8" stroke-width="1" fill="none" opacity="0.6"/>
  </svg>

  <!-- 光を追いかけてはしゃぐ猫 -->
  <div id="chasing-cat-wrap">
    <div id="chasing-light"></div>
    <svg id="chasing-cat" class="cat-svg" viewBox="0 0 52 40" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="28" cy="30" rx="22" ry="10" fill="#c9a97a"/>
      <circle cx="12" cy="18" r="10" fill="#c9a97a"/>
      <path d="M5,12 L7,4 L12,11 Z" fill="#c9a97a"/>
      <path d="M14,11 L19,3 L20,11 Z" fill="#c9a97a"/>
      <circle cx="9" cy="17" r="1.3" fill="#3b2f22"/>
      <path d="M40,26 C46,22 48,14 44,12" stroke="#c9a97a" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- じゃれ合う2匹 -->
  <svg id="playing-cats" class="cat-svg" viewBox="0 0 120 44" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="24" cy="30" rx="20" ry="10" fill="#4d7563"/>
    <circle cx="10" cy="18" r="9" fill="#4d7563"/>
    <path d="M4,12 L6,5 L10,11 Z" fill="#4d7563"/>
    <path d="M12,11 L16,4 L17,11 Z" fill="#4d7563"/>
    <circle cx="8" cy="17" r="1.2" fill="#f6fbf8"/>
    <g class="paw-swipe">
      <ellipse cx="34" cy="24" rx="7" ry="4" fill="#4d7563"/>
    </g>
    <ellipse cx="94" cy="32" rx="20" ry="10" fill="#f0876f"/>
    <circle cx="108" cy="20" r="9" fill="#f0876f"/>
    <path d="M114,14 L112,7 L108,13 Z" fill="#f0876f"/>
    <path d="M106,13 L102,6 L101,13 Z" fill="#f0876f"/>
    <circle cx="110" cy="19" r="1.2" fill="#fff8f3"/>
    <ellipse cx="78" cy="28" rx="7" ry="4" fill="#f0876f"/>
  </svg>

</body>
</html>
